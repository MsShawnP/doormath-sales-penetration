[project]
name = "doormath-sales-penetration"
version = "0.1.0"
description = "Distribution penetration tracker — door counts, ACV%, TDP trends, and authorization gap analysis for CPG brands"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
