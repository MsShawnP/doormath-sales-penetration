[project]
name = "doormath-sales-penetration"
version = "0.1.0"
description = "Distribution penetration tracker — door counts, ACV%, TDP trends, and authorization gap analysis for CPG brands"
requires-python = ">=3.11"
dependencies = [
    "dash>=3.0",
    "plotly>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "dash-ag-grid>=31.0",
    "gunicorn>=22.0",
    # wsgi.py imports flask directly for the health-check endpoint. Dash pulls
    # flask in today, but relying on a transitive dependency for a direct import
    # means a future Dash release could break startup before health checks pass.
    "flask>=3.0",
    "jinja2>=3.1",
    # Local packages under packages/. Install them by path before this project;
    # neither name resolves from a package index. See the README Quick start.
    "cinderhaven-store-universe",
    "lailara-palette",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
pdf = ["weasyprint>=68.0,<69.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/cinderhaven-store-universe/tests"]
