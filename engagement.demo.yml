# ─────────────────────────────────────────────────────────────────────────────
# Lailara LLC — Door Math engagement config (DEMO)
#
# Demo identity is the canonical Cinderhaven brand; `demo: true` so the deploy
# guard ignores it. The deployed demo renders from the seeded
# cinderhaven_store_universe package — this config exercises client_mode.py on
# demo-shaped POS files under client-data/ (gitignored, never committed).
# ─────────────────────────────────────────────────────────────────────────────

client:
  name: "Cinderhaven Provisions (demo)"

engagement:
  id: "CINDERHAVEN-DEMO"

as_of_date: "2025-12-22"   # last completed scan week (2025-W52), never today

prepared_by: "Lailara LLC"

demo: true

basis:
  week_convention: "week_ending_saturday"
  silence_threshold_weeks: 4

inputs:
  scans: "client-data/scans.csv"
  authorizations: "client-data/authorizations.csv"
  stores: "client-data/stores.csv"

columns:
  store_id: "store_id"
  sku: "sku"
  week_ending: "week_ending"
  units_sold: "units_sold"
  authorized_date: "authorized_date"
  deauthorized_date: "deauthorized_date"
  retailer_id: "retailer_id"
  chain_name: "chain_name"
  region: "region"
  state: "state"
  volume_tier: "volume_tier"

thresholds:
  max_blank_fraction_required: 0.02
  fail_on_missing_required_column: true
  fail_on_duplicate_keys: true
